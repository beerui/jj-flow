interface:
  display_name: "jj-dispatch"
  short_description: "业务仓发起多项目调度：PREVIEW/DISPATCH/RECONCILE，可恢复 task_key"
  default_prompt: "Use $jj-dispatch / /jj-dispatch from a business repo (not a control-only cwd). Gate priority: INTAKE_REQUIRED; UNKNOWN->RECONCILE (never recreate same task_key); PREVIEW if unapproved; confirm branch/workspace when uncertain. Codex: missing REQUIRED_APP_CAPABILITIES rejects DISPATCH without mutating plane. Grok (host_id=grok-build): default Mode S per references/grok-dispatch-execution.md — one coordinator session serial + project-branch; do not require multi-session or Grok Workflow for checkpoint; on missing multi-session APIs degrade to Mode S (never fake session-*-YYYYMMDD). Require committed source_head before target DISPATCH; write attestation + receipt files under control_root; produced_commit from git before VERIFIED (user does not run CLI). Exclusive worktree only for isolation. Delegate migration to $jj-same, single-repo loop to $jj-ralph, local review to $jj-review, closeout to $jj-end."
