<div id="ralph-demo-app" class="ralph-demo" tabindex="0">
  <div class="ralph-demo__toolbar">
    <div class="ralph-demo__steps" role="tablist" aria-label="步骤"></div>
    <div class="ralph-demo__nav">
      <button type="button" class="ralph-demo__btn" data-action="prev">上一步</button>
      <button type="button" class="ralph-demo__btn ralph-demo__btn--primary" data-action="next">下一步</button>
      <button type="button" class="ralph-demo__btn" data-action="play" aria-pressed="false">自动播放</button>
    </div>
  </div>
  <p class="ralph-demo__progress" data-progress aria-live="polite"></p>
  <svg class="ralph-demo__stage" viewBox="0 0 980 420" width="100%" height="auto" role="img" aria-label="ralph 内部机制示意"></svg>
  <div class="ralph-demo__panel">
    <p class="ralph-demo__one-liner" data-one></p>
    <h3 data-title></h3>
    <p data-body></p>
    <div class="ralph-demo__cmd">
      <span class="ralph-demo__say">你可以说</span>
      <code data-cmd></code>
      <button type="button" class="ralph-demo__btn" data-action="copy">复制</button>
    </div>
    <ul data-facts></ul>
  </div>
</div>
<style>
.ralph-demo{margin:1.25rem 0 1.75rem;padding:1rem;border:1px solid var(--line,#e5e7eb);border-radius:14px;background:var(--surface,#fff);outline:none}
.ralph-demo:focus-visible{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent,#4f46e5) 55%,transparent)}
.ralph-demo__toolbar{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center}
.ralph-demo__steps{display:flex;flex-wrap:wrap;gap:.4rem}
.ralph-demo__step{border:1px solid var(--line,#e5e7eb);background:var(--panel,#f3f4f6);color:var(--text,#111827);border-radius:999px;padding:.3rem .75rem;font-size:.85rem;cursor:pointer;min-width:2rem}
.ralph-demo__step[aria-selected="true"]{background:var(--accent-soft,#e0e7ff);border-color:color-mix(in srgb,var(--accent,#4f46e5) 45%,var(--line,#e5e7eb));font-weight:600}
.ralph-demo__nav{display:flex;flex-wrap:wrap;gap:.5rem}
.ralph-demo__btn{border:1px solid var(--line,#e5e7eb);background:var(--panel,#f3f4f6);color:var(--text,#111827);border-radius:10px;padding:.4rem .8rem;cursor:pointer}
.ralph-demo__btn--primary{background:var(--text,#111827);color:#fff;border-color:transparent}
.ralph-demo__btn[aria-pressed="true"]{background:var(--accent-soft,#e0e7ff);border-color:color-mix(in srgb,var(--accent,#4f46e5) 40%,var(--line,#e5e7eb))}
.ralph-demo__btn:disabled{opacity:.45;cursor:not-allowed}
.ralph-demo__progress{margin:.75rem 0 .25rem;color:var(--muted,#6b7280);font-size:.9rem}
.ralph-demo__stage{display:block;margin-top:.5rem;border-radius:12px;background:#0b1220}
.ralph-demo__panel{margin-top:.9rem;padding:1rem 1.1rem;border-radius:12px;background:var(--panel,#f3f4f6)}
.ralph-demo__one-liner{margin:0 0 .55rem;padding:.45rem .7rem;border-radius:8px;background:color-mix(in srgb,var(--accent,#4f46e5) 12%,#fff);color:var(--text,#111827);font-weight:600;font-size:.95rem}
.ralph-demo__panel h3{margin:0 0 .35rem;font-size:1.05rem}
.ralph-demo__panel p{margin:0 0 .65rem;line-height:1.6;color:var(--text,#1f2937)}
.ralph-demo__cmd{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.75rem}
.ralph-demo__say{font-size:.85rem;color:var(--muted,#6b7280);flex:0 0 auto}
.ralph-demo__cmd code{flex:1 1 14rem;display:block;padding:.55rem .7rem;border-radius:8px;background:#111827;color:#dbeafe;white-space:pre-wrap;word-break:break-word;font-size:.88rem}
.ralph-demo__panel ul{margin:0;padding-left:1.15rem}
.ralph-demo__panel li{margin:.28rem 0;color:var(--muted,#4b5563);line-height:1.45}
.ralph-demo .lane{fill:#111827;stroke:#1f2937}
.ralph-demo .node{fill:#1f2937;stroke:#6b7280;stroke-width:1.5;transition:fill .35s,stroke .35s,filter .35s}
.ralph-demo .node.active{fill:#172554;stroke:#60a5fa;stroke-width:2.4;filter:drop-shadow(0 0 8px rgba(96,165,250,.45))}
.ralph-demo .node.done{fill:#052e1c;stroke:#34d399;stroke-width:2}
.ralph-demo .node.blocked{fill:#3f1d1d;stroke:#f87171;stroke-width:2.2}
.ralph-demo .node.pulse{animation:rd-pulse 1.4s ease-in-out infinite}
.ralph-demo .edge{fill:none;stroke:#374151;stroke-width:2.2;opacity:.35}
.ralph-demo .edge.active{stroke:#60a5fa;opacity:1;stroke-dasharray:8 6;animation:rd-dash 1s linear infinite}
.ralph-demo .edge.done{stroke:#34d399;opacity:.95;stroke-dasharray:none;animation:none}
.ralph-demo .edge.back{stroke:#fbbf24;opacity:1;stroke-dasharray:6 5;animation:rd-dash 1.1s linear infinite}
.ralph-demo .label{fill:#e5e7eb;font-size:13px;font-family:ui-sans-serif,system-ui,sans-serif;font-weight:600;pointer-events:none}
.ralph-demo .sub,.ralph-demo .zone{fill:#9ca3af;font-size:11.5px;font-family:ui-sans-serif,system-ui,sans-serif;pointer-events:none}
.ralph-demo .zone{font-weight:500}
.ralph-demo .hint{fill:#94a3b8;font-size:11px;font-family:ui-sans-serif,system-ui,sans-serif}
.ralph-demo .loop-arrow{fill:none;stroke:#f59e0b;stroke-width:2;opacity:.9;stroke-dasharray:5 4;animation:rd-dash .9s linear infinite}
@keyframes rd-pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(96,165,250,.25))}50%{filter:drop-shadow(0 0 14px rgba(96,165,250,.7))}}
@keyframes rd-dash{to{stroke-dashoffset:-28}}
</style>
<script>
(() => {
  const root = document.getElementById("ralph-demo-app");
  if (!root || root.dataset.ready === "1") return;
  root.dataset.ready = "1";

  // 内部机制：阶段门、强度、改代码循环、停表、验收双层、归档、相邻回退、归档后续作
  const steps = [
    {
      title: "任务落在本仓库的一个文件夹里",
      one: "聊天不能当进度；进度在 .workflow/ralph/RALPH-…/ 里。",
      body: "你在业务仓里说「做这个需求」，会开一个任务目录：run.json 记阶段与检查点，progress.md 记过程。控制层 ~/.jj-flow 是多仓调度用的，不是 ralph 的主账本。",
      cmd: "$jj-ralph 先改承接：登录后密码过期要提示",
      facts: [
        "目录：.workflow/ralph/RALPH-…/run.json、progress.md",
        "还有 analyze.md / plan.md / acceptance.md 等阶段产物",
        "业务仓本机路径；不是 ~/.jj-flow"
      ],
      active: { ledger: true, run: true },
      done: {},
      edges: ["run-ledger"],
      phase: null,
      intensity: "standard"
    },
    {
      title: "五段流水线：分析 → 计划 → 改 → 验 → 归档",
      one: "阶段往前走靠「检查点通过」，不是靠聊天说好了。",
      body: "五个阶段固定顺序。某一段的检查点（gate）通过后，才进下一段。验收通过后默认收尾归档。",
      cmd: "（跟着 agent 做即可，不必手敲阶段命令）",
      facts: [
        "ANALYZE 分析 → PLAN 计划 → DELIVER 改代码 → ACCEPT 验收 → ARCHIVE 归档",
        "终态常见：已完成 / 暂停 / 阻塞 / 等你点头",
        "验收通过 → 默认 finalize（进地图 + 冻结副本）"
      ],
      active: { p0: true, p1: true, p2: true, p3: true, p4: true },
      done: { ledger: true, run: true },
      edges: ["e01", "e12", "e23", "e34"],
      phase: "all",
      intensity: "standard"
    },
    {
      title: "强度档：tiny / standard / strict",
      one: "用口语选速度与严格度；不说就按标准档。",
      body: "tiny 单点快做；standard 正常闭环；strict 更严（预算更紧，验收前多一道「判断层」如审查/复检）。连续两轮改代码没改进会停表，避免空转。",
      cmd: "$jj-ralph tiny：…\n$jj-ralph strict：…验收前要审查\n（不说强度 = standard）",
      facts: [
        "写入 run.intensity，并带默认预算 / 停表 / 验收层配置",
        "strict：验收前判断层必须过",
        "停表：连续无改进 → 阻塞，提示换策略"
      ],
      active: { intensity: true, p2: true },
      done: { ledger: true, run: true },
      edges: ["int-del"],
      phase: "DELIVER",
      intensity: "strict"
    },
    {
      title: "改代码阶段可以循环：改 → 验 → 再改",
      one: "DELIVER 不是一次过：验证失败会在本阶段打转。",
      body: "每次认真尝试应记一笔 deliver-attempt。验证挂了且还没触顶，就继续改。同一招连败两次要换法。",
      cmd: "$jj-ralph 继续 RALPH-xxx：验证挂了，按报错改",
      facts: [
        "循环在「改代码」阶段内部，不是跳过验收",
        "有改进 / 无改进会影响是否停表",
        "触顶最大次数会停，避免无限磨"
      ],
      active: { p2: true, loop: true },
      done: { p0: true, p1: true, ledger: true },
      edges: ["e12", "loop"],
      phase: "DELIVER",
      intensity: "standard"
    },
    {
      title: "验收：机械检查 +（严格档）判断层",
      one: "缺证据不能验收通过；严格档还要审查/复检过。",
      body: "机械层：改代码阶段已通过、路径对得上、审查不能是「必须改」。严格档还要判断层 PASS。审查说要改就不能强行验收。",
      cmd: "$jj-ralph 按 acceptance 清单验收\n$jj-ralph recheck RALPH-xxx：…",
      facts: [
        "机械层：一致性 / 证据 / 审查状态",
        "判断层：strict 必过；可用审查记录自动写入",
        "「验收不算」→ 记失败或退回改代码"
      ],
      active: { p3: true, layers: true },
      done: { p0: true, p1: true, p2: true, ledger: true },
      edges: ["e23"],
      phase: "ACCEPT",
      intensity: "strict"
    },
    {
      title: "归档：冻结任务 + 写进能力地图",
      one: "归档后旧目录不能改回进行中。",
      body: "finalize = 合并 business-map + 写出归档冻结副本。做完要迁到别的仓，说「交接到 …」走 same，不是在调度控制层里当业务仓硬做。",
      cmd: "（验收通过后默认归档）\n交接到 兑接 承载",
      facts: [
        "产物：archive 目录 + business-map.json",
        "归档后再改 → 新开 RALPH-…（见续作）",
        "提交 / 合分支另走 end 或你自己 git"
      ],
      active: { p4: true, map: true },
      done: { p0: true, p1: true, p2: true, p3: true, ledger: true, run: true },
      edges: ["e34", "arch-map"],
      phase: "ARCHIVE",
      intensity: "standard"
    },
    {
      title: "回退只能相邻阶段",
      one: "验收→改代码→计划→分析，一步一步退；归档不能退。",
      body: "说「验收不算，退回改」会退到相邻阶段。已经归档的不能 reopen 旧目录；要再做就新开任务。",
      cmd: "$jj-ralph 验收不算，退回 DELIVER：…\n$jj-ralph 先暂停 RALPH-xxx",
      facts: [
        "相邻边：不能从验收一次跳回分析",
        "暂停 / 阻塞：状态标记，进度里留痕",
        "不会默认 git revert"
      ],
      active: { p2: true, p3: true },
      done: { p0: true, p1: true, ledger: true },
      edges: ["back32"],
      phase: "DELIVER",
      intensity: "standard",
      blocked: { p3: true }
    },
    {
      title: "归档后还要改：新任务 + progress 写关系",
      one: "纠正写 supersedes_run_id；加功能写 parent_run_id。",
      body: "旧任务保持归档。新开 RALPH-…，在 progress.md 写清和旧任务的关系。纯加功能别写成 supersedes（那表示旧版作废）。",
      cmd: "$jj-ralph 纠正 RALPH-旧编号：…\n$jj-ralph 子需求续 RALPH-旧编号：…",
      facts: [
        "写在 progress.md，不要 invent 进 run.json",
        "还没归档：同一 RALPH-… 里继续改 / 加",
        "详情见本页「做完了还要改」"
      ],
      active: { run: true, chain: true, ledger: true },
      done: { p4: true, map: true },
      edges: ["chain-run"],
      phase: "ARCHIVE",
      intensity: "standard"
    }
  ];

  // layout
  const nodes = {
    ledger: { x: 40, y: 24, w: 200, h: 56 },
    run: { x: 280, y: 24, w: 200, h: 56 },
    intensity: { x: 520, y: 24, w: 180, h: 56 },
    map: { x: 740, y: 24, w: 200, h: 56 },
    p0: { x: 40, y: 160, w: 150, h: 64 },
    p1: { x: 220, y: 160, w: 150, h: 64 },
    p2: { x: 400, y: 160, w: 150, h: 64 },
    p3: { x: 580, y: 160, w: 150, h: 64 },
    p4: { x: 760, y: 160, w: 160, h: 64 },
    loop: { x: 400, y: 280, w: 150, h: 52 },
    layers: { x: 560, y: 280, w: 190, h: 52 },
    chain: { x: 780, y: 280, w: 160, h: 52 }
  };

  const labels = {
    ledger: ["任务目录", ".workflow/ralph/…"],
    run: ["run.json + progress", "阶段 / 检查点 / 过程"],
    intensity: ["强度档", "tiny · standard · strict"],
    map: ["能力地图", "business-map.json"],
    p0: ["1 分析", "ANALYZE"],
    p1: ["2 计划", "PLAN"],
    p2: ["3 改代码", "DELIVER"],
    p3: ["4 验收", "ACCEPT"],
    p4: ["5 归档", "ARCHIVE"],
    loop: ["改代码循环", "改→验→再改"],
    layers: ["验收双层", "机械 + 判断(strict)"],
    chain: ["归档后续作", "新 RALPH + 关系"]
  };

  const edgePaths = {
    "run-ledger": "M280 52 H 240",
    "e01": "M190 192 H 220",
    "e12": "M370 192 H 400",
    "e23": "M550 192 H 580",
    "e34": "M730 192 H 760",
    "int-del": "M610 80 V 160",
    "loop": "M475 224 V 280",
    "arch-map": "M840 160 V 80",
    "back32": "M655 210 C 640 240, 540 240, 520 210",
    "chain-run": "M860 280 C 860 120, 480 40, 380 52"
  };

  const stage = root.querySelector(".ralph-demo__stage");
  const stepsEl = root.querySelector(".ralph-demo__steps");
  const progress = root.querySelector("[data-progress]");
  const oneEl = root.querySelector("[data-one]");
  const titleEl = root.querySelector("[data-title]");
  const bodyEl = root.querySelector("[data-body]");
  const cmdEl = root.querySelector("[data-cmd]");
  const factsEl = root.querySelector("[data-facts]");
  const prevBtn = root.querySelector('[data-action="prev"]');
  const nextBtn = root.querySelector('[data-action="next"]');
  const playBtn = root.querySelector('[data-action="play"]');
  const copyBtn = root.querySelector('[data-action="copy"]');

  let index = 0;
  let playTimer = null;

  steps.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ralph-demo__step";
    btn.setAttribute("role", "tab");
    btn.textContent = String(i + 1);
    btn.title = s.title;
    btn.addEventListener("click", () => {
      stopPlay();
      index = i;
      render();
    });
    stepsEl.appendChild(btn);
  });

  function nodeClass(id, step) {
    if (step.blocked && step.blocked[id]) return "node blocked pulse";
    if (step.active && step.active[id]) return "node active pulse";
    if (step.done && step.done[id]) return "node done";
    return "node";
  }

  function edgeClass(id, step) {
    if (!step.edges || !step.edges.includes(id)) return "edge";
    if (id === "back32") return "edge back";
    if (id === "loop") return "loop-arrow";
    if (step.done && step.done.p4) return "edge done";
    return "edge active";
  }

  function renderStage(step) {
    let svg = "";
    svg += '<defs>';
    svg += '<marker id="rd-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#60a5fa"/></marker>';
    svg += '<marker id="rd-arrow-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/></marker>';
    svg += '<marker id="rd-arrow-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>';
    svg += "</defs>";

    svg += '<rect class="lane" x="20" y="12" width="940" height="88" rx="14"/>';
    svg += '<rect class="lane" x="20" y="130" width="940" height="120" rx="14"/>';
    svg += '<rect class="lane" x="20" y="268" width="940" height="100" rx="14"/>';
    svg += '<text class="zone" x="32" y="120">记录层 · 业务仓内 .workflow/ralph/（不是 ~/.jj-flow）</text>';
    svg += '<text class="zone" x="32" y="262">阶段流水线 · 检查点通过才往下</text>';
    svg += '<text class="zone" x="32" y="388">内部机制 · 循环 / 验收层 / 归档后续作</text>';
    svg += '<text class="hint" x="700" y="408">蓝=当前 · 绿=完成 · 红=卡住 · 黄=回退</text>';

    // intensity badge
    const intLabel = step.intensity || "standard";
    svg += `<rect x="520" y="90" width="120" height="22" rx="6" fill="#1e293b" stroke="#475569"/>`;
    svg += `<text class="hint" x="532" y="105">intensity: ${intLabel}</text>`;

    Object.entries(edgePaths).forEach(([id, d]) => {
      const cls = edgeClass(id, step);
      let marker = "url(#rd-arrow)";
      if (cls.includes("done")) marker = "url(#rd-arrow-g)";
      if (cls.includes("back") || id === "loop") marker = "url(#rd-arrow-y)";
      if (!step.edges || !step.edges.includes(id)) {
        svg += `<path class="edge" d="${d}" />`;
      } else {
        svg += `<path class="${cls}" d="${d}" marker-end="${marker}"/>`;
      }
    });

    Object.entries(nodes).forEach(([id, n]) => {
      const [t1, t2] = labels[id];
      svg += `<rect class="${nodeClass(id, step)}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="12"/>`;
      svg += `<text class="label" x="${n.x + 12}" y="${n.y + 26}">${t1}</text>`;
      svg += `<text class="sub" x="${n.x + 12}" y="${n.y + 46}">${t2}</text>`;
    });

    stage.innerHTML = svg;
  }

  function render() {
    const step = steps[index];
    [...stepsEl.children].forEach((btn, i) => {
      btn.setAttribute("aria-selected", i === index ? "true" : "false");
    });
    progress.textContent = `第 ${index + 1} / ${steps.length} 步 · 点数字或左右键 · 可自动播放`;
    oneEl.textContent = step.one;
    titleEl.textContent = step.title;
    bodyEl.textContent = step.body;
    cmdEl.textContent = step.cmd;
    factsEl.innerHTML = step.facts.map((f) => `<li>${f}</li>`).join("");
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === steps.length - 1;
    renderStage(step);
  }

  function stopPlay() {
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = null;
    }
    playBtn.setAttribute("aria-pressed", "false");
    playBtn.textContent = "自动播放";
  }

  function startPlay() {
    stopPlay();
    playBtn.setAttribute("aria-pressed", "true");
    playBtn.textContent = "停止";
    playTimer = setInterval(() => {
      if (index >= steps.length - 1) {
        stopPlay();
        return;
      }
      index += 1;
      render();
    }, 3800);
  }

  prevBtn.addEventListener("click", () => {
    stopPlay();
    if (index > 0) {
      index -= 1;
      render();
    }
  });
  nextBtn.addEventListener("click", () => {
    stopPlay();
    if (index < steps.length - 1) {
      index += 1;
      render();
    }
  });
  playBtn.addEventListener("click", () => {
    if (playTimer) stopPlay();
    else {
      if (index >= steps.length - 1) index = 0;
      render();
      startPlay();
    }
  });
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(steps[index].cmd);
      copyBtn.textContent = "已复制";
      setTimeout(() => {
        copyBtn.textContent = "复制";
      }, 1200);
    } catch {
      copyBtn.textContent = "失败";
      setTimeout(() => {
        copyBtn.textContent = "复制";
      }, 1200);
    }
  });
  root.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && index > 0) {
      stopPlay();
      index -= 1;
      render();
    }
    if (e.key === "ArrowRight" && index < steps.length - 1) {
      stopPlay();
      index += 1;
      render();
    }
    if (e.key === " " && e.target === root) {
      e.preventDefault();
      playBtn.click();
    }
  });

  render();
})();
</script>
