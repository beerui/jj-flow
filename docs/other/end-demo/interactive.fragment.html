<div id="end-demo-app" class="end-demo" tabindex="0">
  <div class="end-demo__toolbar">
    <div class="end-demo__steps" role="tablist" aria-label="步骤"></div>
    <div class="end-demo__nav">
      <button type="button" class="end-demo__btn" data-action="prev">上一步</button>
      <button type="button" class="end-demo__btn end-demo__btn--primary" data-action="next">下一步</button>
      <button type="button" class="end-demo__btn" data-action="play" aria-pressed="false">自动播放</button>
    </div>
  </div>
  <p class="end-demo__progress" data-progress aria-live="polite"></p>
  <svg class="end-demo__stage" viewBox="0 0 980 420" width="100%" height="auto" role="img" aria-label="jj-end 收工内部机制示意"></svg>
  <div class="end-demo__panel">
    <p class="end-demo__one-liner" data-one></p>
    <h3 data-title></h3>
    <p data-body></p>
    <div class="end-demo__cmd">
      <span class="end-demo__say">你可以说</span>
      <code data-cmd></code>
      <button type="button" class="end-demo__btn" data-action="copy">复制</button>
    </div>
    <ul data-facts></ul>
  </div>
</div>
<style>
.end-demo{margin:1.25rem 0 1.75rem;padding:1rem;border:1px solid var(--line,#e5e7eb);border-radius:14px;background:var(--surface,#fff);outline:none}
.end-demo:focus-visible{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent,#4f46e5) 55%,transparent)}
.end-demo__toolbar{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center}
.end-demo__steps{display:flex;flex-wrap:wrap;gap:.4rem}
.end-demo__step{border:1px solid var(--line,#e5e7eb);background:var(--panel,#f3f4f6);color:var(--text,#111827);border-radius:999px;padding:.3rem .75rem;font-size:.85rem;cursor:pointer;min-width:2rem}
.end-demo__step[aria-selected="true"]{background:var(--accent-soft,#e0e7ff);border-color:color-mix(in srgb,var(--accent,#4f46e5) 45%,var(--line,#e5e7eb));font-weight:600}
.end-demo__nav{display:flex;flex-wrap:wrap;gap:.5rem}
.end-demo__btn{border:1px solid var(--line,#e5e7eb);background:var(--panel,#f3f4f6);color:var(--text,#111827);border-radius:10px;padding:.4rem .8rem;cursor:pointer}
.end-demo__btn--primary{background:var(--text,#111827);color:#fff;border-color:transparent}
.end-demo__btn[aria-pressed="true"]{background:var(--accent-soft,#e0e7ff);border-color:color-mix(in srgb,var(--accent,#4f46e5) 40%,var(--line,#e5e7eb))}
.end-demo__btn:disabled{opacity:.45;cursor:not-allowed}
.end-demo__progress{margin:.75rem 0 .25rem;color:var(--muted,#6b7280);font-size:.9rem}
.end-demo__stage{display:block;margin-top:.5rem;border-radius:12px;background:#0b1220}
.end-demo__panel{margin-top:.9rem;padding:1rem 1.1rem;border-radius:12px;background:var(--panel,#f3f4f6)}
.end-demo__one-liner{margin:0 0 .55rem;padding:.45rem .7rem;border-radius:8px;background:color-mix(in srgb,var(--accent,#4f46e5) 12%,#fff);color:var(--text,#111827);font-weight:600;font-size:.95rem}
.end-demo__panel h3{margin:0 0 .35rem;font-size:1.05rem}
.end-demo__panel p{margin:0 0 .65rem;line-height:1.6;color:var(--text,#1f2937)}
.end-demo__cmd{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.75rem}
.end-demo__say{font-size:.85rem;color:var(--muted,#6b7280);flex:0 0 auto}
.end-demo__cmd code{flex:1 1 14rem;display:block;padding:.55rem .7rem;border-radius:8px;background:#111827;color:#dbeafe;white-space:pre-wrap;word-break:break-word;font-size:.88rem}
.end-demo__panel ul{margin:0;padding-left:1.15rem}
.end-demo__panel li{margin:.28rem 0;color:var(--muted,#4b5563);line-height:1.45}
.end-demo .lane{fill:#111827;stroke:#1f2937}
.end-demo .node{fill:#1f2937;stroke:#6b7280;stroke-width:1.5;transition:fill .35s,stroke .35s,filter .35s}
.end-demo .node.active{fill:#172554;stroke:#60a5fa;stroke-width:2.4;filter:drop-shadow(0 0 8px rgba(96,165,250,.45))}
.end-demo .node.done{fill:#052e1c;stroke:#34d399;stroke-width:2}
.end-demo .node.blocked{fill:#3f1d1d;stroke:#f87171;stroke-width:2.2}
.end-demo .node.pulse{animation:ed-pulse 1.4s ease-in-out infinite}
.end-demo .edge{fill:none;stroke:#374151;stroke-width:2.2;opacity:.3}
.end-demo .edge.active{stroke:#60a5fa;opacity:1;stroke-dasharray:8 6;animation:ed-dash 1s linear infinite}
.end-demo .edge.done{stroke:#34d399;opacity:.95;stroke-dasharray:none;animation:none}
.end-demo .edge.warn{stroke:#fbbf24;opacity:1;stroke-dasharray:6 5;animation:ed-dash 1.1s linear infinite}
.end-demo .label{fill:#e5e7eb;font-size:13px;font-family:ui-sans-serif,system-ui,sans-serif;font-weight:600;pointer-events:none}
.end-demo .sub,.end-demo .zone{fill:#9ca3af;font-size:11.5px;font-family:ui-sans-serif,system-ui,sans-serif;pointer-events:none}
.end-demo .zone{font-weight:500}
.end-demo .hint{fill:#94a3b8;font-size:11px;font-family:ui-sans-serif,system-ui,sans-serif}
@keyframes ed-pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(96,165,250,.25))}50%{filter:drop-shadow(0 0 14px rgba(96,165,250,.7))}}
@keyframes ed-dash{to{stroke-dashoffset:-28}}
</style>
<script>
(() => {
  const root = document.getElementById("end-demo-app");
  if (!root || root.dataset.ready === "1") return;
  root.dataset.ready = "1";

  // jj-end 内部固定顺序：fetch→commit→sync work→push work→sync integ→merge→push integ→return
  const steps = [
    {
      title: "先看清：在哪个仓库、哪条工作分支",
      one: "收工 = 把本任务提交并合进集成分支（默认 dev），再推远端。",
      body: "先确认 git 根目录、当前分支（工作分支）、有没有远端。合入目标按：你指定 → 仓库约定 → 有 dev 用 dev，否则 develop，再否则 main。",
      cmd: "$jj-end\n收工，合到 dev",
      facts: [
        "不等于 ralph 归档；也不写调度控制层",
        "调度「验收通过」≠ 已经 push / 合进 dev",
        "禁止 force push、删分支、改 git 配置"
      ],
      active: { work: true, integ: true, remote: true },
      done: {},
      edges: ["work-remote", "integ-remote"]
    },
    {
      title: "0. 先 fetch，并做安全检查",
      one: "没拉远端最新就别硬推；危险状态直接停。",
      body: "必须先 git fetch。若不是 git 仓、没有 remote、detached HEAD、正在 merge/rebase、脏文件明显不是本任务 → hard-stop，不改仓库。",
      cmd: "$jj-end dry_run=true\n（只打印计划表：将提交/拉取/合并/推送哪些，不真改）",
      facts: [
        "dry_run：只出表，不写仓库",
        "用户禁止 push/merge 时同样不真合、不真推",
        "monorepo 误判根目录 → 停，报告 show-toplevel"
      ],
      active: { remote: true, fetch: true, work: true, dry: true },
      done: {},
      edges: ["remote-fetch", "fetch-work"]
    },
    {
      title: "1. 只提交本任务改动",
      one: "有未提交改动就 commit；无关脏文件不要 stage。",
      body: "中文 Conventional Commits：type(scope): 摘要。先 commit 再 pull，避免脏树拉不下来。已经干净则跳过提交。",
      cmd: "（agent 自动）git add 本任务文件 → commit\n例如：fix(login): 密码过期提示跳转",
      facts: [
        "git diff --check 失败要先修",
        "secrets / 临时脚本 / dump 不要进提交",
        "无可收尾（已干净+已同步+已在集成分支）→ 报告后停"
      ],
      active: { work: true, commit: true },
      done: { remote: true, fetch: true },
      edges: ["work-commit"]
    },
    {
      title: "2. 同步工作分支，再推工作分支",
      one: "先把远端 work 合进来，再 push work；禁止跳过直接推。",
      body: "优先快进 pull；分叉了默认 merge 拉（不 rebase，除非你点名）。冲突 → abort，留在工作分支，报告文件。然后再 push 工作分支（禁止 force）。",
      cmd: "（内部）pull work → push work",
      facts: [
        "远端还没有 work 分支：push -u 建跟踪",
        "pull 冲突：停，不假装成功",
        "「只推了 work」还不算收工成功"
      ],
      active: { work: true, remote: true, pushW: true },
      done: { commit: true, fetch: true },
      edges: ["work-remote", "remote-work", "work-pushw"]
    },
    {
      title: "3. 切到集成分支并拉最新",
      one: "合入目标通常是 dev（或 develop / main）。",
      body: "checkout 集成分支（本地没有则跟踪远端）。再 pull 到最新。本地远端都没有该分支 → 停，不新建空历史。",
      cmd: "（内部）checkout dev → pull dev",
      facts: [
        "若工作分支已经等于集成分支：跳过「合另一条线」，仍要 push",
        "pull 冲突：abort 并回到 work",
        "解析顺序：显式 integration= → 约定 → dev→develop→main"
      ],
      active: { integ: true, remote: true, fetch: true },
      done: { work: true, commit: true, pushW: true },
      edges: ["remote-integ", "fetch-integ"]
    },
    {
      title: "4. 把工作分支合进集成分支",
      one: "这一步不能省：push work 之后对话不能就此结束。",
      body: "在集成分支上 merge 工作分支。已是 ancestor（Already up to date）也算过。冲突 → merge --abort，切回 work，列出冲突，不擅自解业务冲突。",
      cmd: "（内部）在 dev 上：git merge 工作分支",
      facts: [
        "禁止因「怕 merge」跳过",
        "失败后不能留下半成品 merge 状态",
        "merge abort 后的回退 ≠ 收工成功"
      ],
      active: { integ: true, work: true, merge: true },
      done: { pushW: true, commit: true },
      edges: ["work-merge", "merge-integ"]
    },
    {
      title: "5. 推集成分支，再回到工作分支",
      one: "合完还要 push 集成分支；默认再切回 work。",
      body: "push integration（禁止 force）。失败则尽量回到 work，并说明：本地可能已 merge 但远端还没有。return_to 默认 work，可留在 integration。",
      cmd: "（内部）push dev → checkout 工作分支\n$jj-end return_to=integration  # 想留在 dev 时",
      facts: [
        "完成报告要含：分支名、commit、是否 merge、推了哪些",
        "缺任一步且非 hard-stop/冲突 → 应继续做完",
        "不写 ralph run、不写 dispatch plane"
      ],
      active: { integ: true, remote: true, pushI: true, work: true },
      done: { merge: true, commit: true, pushW: true },
      edges: ["integ-pushi", "pushi-remote", "return-work"]
    },
    {
      title: "冲突 / 失败时怎么停",
      one: "停在可恢复状态：尽量回到工作分支，说清楚卡在哪。",
      body: "pull work 冲突、merge 冲突、push 失败：abort（如需要）→ checkout work → 中文说明冲突文件或远端报错。禁止 force、禁止当成功汇报。",
      cmd: "（失败示例）冲突后回到 feature/…，列出冲突文件，请你处理后重跑 $jj-end",
      facts: [
        "commit 前 hard-stop：不改分支、不 merge",
        "push integration 失败：可能本地已 merge 未推送",
        "用户禁止 push/merge 或 dry_run：只报告计划"
      ],
      active: { work: true, dry: true },
      done: {},
      edges: [],
      blocked: { merge: true, pushI: true }
    }
  ];

  const nodes = {
    remote: { x: 380, y: 22, w: 200, h: 54 },
    fetch: { x: 640, y: 22, w: 140, h: 54 },
    work: { x: 40, y: 140, w: 190, h: 70 },
    commit: { x: 260, y: 140, w: 150, h: 70 },
    pushW: { x: 440, y: 140, w: 150, h: 70 },
    integ: { x: 40, y: 280, w: 190, h: 70 },
    merge: { x: 280, y: 280, w: 170, h: 70 },
    pushI: { x: 500, y: 280, w: 160, h: 70 },
    dry: { x: 720, y: 280, w: 200, h: 70 }
  };

  const labels = {
    remote: ["远端 origin", "禁止 force push"],
    fetch: ["fetch", "先拉再推"],
    work: ["工作分支", "feature / 当前 HEAD"],
    commit: ["commit", "仅本任务 · 中文摘要"],
    pushW: ["push work", "同步后再推"],
    integ: ["集成分支", "dev → develop → main"],
    merge: ["merge", "work → integration"],
    pushI: ["push 集成", "合完必须推"],
    dry: ["dry_run / 禁推", "只出计划表"]
  };

  const edgePaths = {
    "work-remote": "M230 160 C 300 100, 350 70, 380 55",
    "remote-work": "M380 55 C 300 90, 250 120, 230 160",
    "integ-remote": "M230 300 C 300 240, 340 100, 400 76",
    "remote-integ": "M400 76 C 340 120, 280 220, 230 300",
    "remote-fetch": "M580 49 H 640",
    "fetch-work": "M710 76 C 720 120, 400 130, 340 155",
    "fetch-integ": "M710 76 C 700 180, 400 260, 230 300",
    "work-commit": "M230 175 H 260",
    "work-pushw": "M410 175 H 440",
    "work-merge": "M135 210 V 280",
    "merge-integ": "M280 315 H 230",
    "integ-pushi": "M450 315 H 500",
    "pushi-remote": "M580 280 C 600 200, 520 100, 480 76",
    "return-work": "M580 315 C 700 240, 500 180, 230 190"
  };

  const stage = root.querySelector(".end-demo__stage");
  const stepsEl = root.querySelector(".end-demo__steps");
  const progress = root.querySelector("[data-progress]");
  const oneEl = root.querySelector("[data-one]");
  const titleEl = root.querySelector("[data-title]");
  const bodyEl = root.querySelector("[data-body]");
  const cmdEl = root.querySelector("[data-cmd]");
  const factsEl = root.querySelector("[data-facts]");
  const prevBtn = root.querySelector('[data-action="prev"]');
  const nextBtn = root.querySelector('[data-action="next"]');
  const playBtn = root.querySelector('[data-action="play"]');
  const copyBtn = root.querySelector('[data-action="copy"]');

  let index = 0;
  let playTimer = null;

  steps.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "end-demo__step";
    btn.setAttribute("role", "tab");
    btn.textContent = String(i + 1);
    btn.title = s.title;
    btn.addEventListener("click", () => {
      stopPlay();
      index = i;
      render();
    });
    stepsEl.appendChild(btn);
  });

  function nodeClass(id, step) {
    if (step.blocked && step.blocked[id]) return "node blocked pulse";
    if (step.active && step.active[id]) return "node active pulse";
    if (step.done && step.done[id]) return "node done";
    return "node";
  }

  function edgeClass(id, step) {
    if (!step.edges || !step.edges.includes(id)) return "edge";
    if (step.done && step.done.pushI) return "edge done";
    return "edge active";
  }

  function renderStage(step) {
    let svg = "";
    svg += '<defs>';
    svg += '<marker id="ed-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#60a5fa"/></marker>';
    svg += '<marker id="ed-arrow-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/></marker>';
    svg += "</defs>";

    svg += '<rect class="lane" x="20" y="10" width="940" height="80" rx="14"/>';
    svg += '<rect class="lane" x="20" y="116" width="940" height="120" rx="14"/>';
    svg += '<rect class="lane" x="20" y="256" width="940" height="120" rx="14"/>';
    svg += '<text class="zone" x="32" y="104">远端与安全检查</text>';
    svg += '<text class="zone" x="32" y="248">工作分支 work · 提交并推送</text>';
    svg += '<text class="zone" x="32" y="390">集成分支 integration · 合并并推送 · 再返回</text>';
    svg += '<text class="hint" x="680" y="408">蓝=当前 · 绿=完成 · 红=失败点 · 禁止 force</text>';

    Object.entries(edgePaths).forEach(([id, d]) => {
      const on = step.edges && step.edges.includes(id);
      const cls = on ? edgeClass(id, step) : "edge";
      const marker = cls.includes("done") ? "url(#ed-arrow-g)" : "url(#ed-arrow)";
      if (on) svg += `<path class="${cls}" d="${d}" marker-end="${marker}"/>`;
      else svg += `<path class="edge" d="${d}"/>`;
    });

    Object.entries(nodes).forEach(([id, n]) => {
      // show dry only on last two steps relevance
      if (id === "dry" && index < 1 && index !== 7) {
        // still show faintly via default node
      }
      const [t1, t2] = labels[id];
      svg += `<rect class="${nodeClass(id, step)}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="12"/>`;
      svg += `<text class="label" x="${n.x + 12}" y="${n.y + 28}">${t1}</text>`;
      svg += `<text class="sub" x="${n.x + 12}" y="${n.y + 48}">${t2}</text>`;
    });

    stage.innerHTML = svg;
  }

  function render() {
    const step = steps[index];
    [...stepsEl.children].forEach((btn, i) => {
      btn.setAttribute("aria-selected", i === index ? "true" : "false");
    });
    progress.textContent = `第 ${index + 1} / ${steps.length} 步 · 点数字或左右键 · 可自动播放`;
    oneEl.textContent = step.one;
    titleEl.textContent = step.title;
    bodyEl.textContent = step.body;
    cmdEl.textContent = step.cmd;
    factsEl.innerHTML = step.facts.map((f) => `<li>${f}</li>`).join("");
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === steps.length - 1;
    renderStage(step);
  }

  function stopPlay() {
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = null;
    }
    playBtn.setAttribute("aria-pressed", "false");
    playBtn.textContent = "自动播放";
  }

  function startPlay() {
    stopPlay();
    playBtn.setAttribute("aria-pressed", "true");
    playBtn.textContent = "停止";
    playTimer = setInterval(() => {
      if (index >= steps.length - 1) {
        stopPlay();
        return;
      }
      index += 1;
      render();
    }, 3800);
  }

  prevBtn.addEventListener("click", () => {
    stopPlay();
    if (index > 0) {
      index -= 1;
      render();
    }
  });
  nextBtn.addEventListener("click", () => {
    stopPlay();
    if (index < steps.length - 1) {
      index += 1;
      render();
    }
  });
  playBtn.addEventListener("click", () => {
    if (playTimer) stopPlay();
    else {
      if (index >= steps.length - 1) index = 0;
      render();
      startPlay();
    }
  });
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(steps[index].cmd);
      copyBtn.textContent = "已复制";
      setTimeout(() => {
        copyBtn.textContent = "复制";
      }, 1200);
    } catch {
      copyBtn.textContent = "失败";
      setTimeout(() => {
        copyBtn.textContent = "复制";
      }, 1200);
    }
  });
  root.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && index > 0) {
      stopPlay();
      index -= 1;
      render();
    }
    if (e.key === "ArrowRight" && index < steps.length - 1) {
      stopPlay();
      index += 1;
      render();
    }
    if (e.key === " " && e.target === root) {
      e.preventDefault();
      playBtn.click();
    }
  });

  render();
})();
</script>
