<div id="dispatch-demo-app" class="dispatch-demo" tabindex="0">
  <div class="dispatch-demo__toolbar">
    <div class="dispatch-demo__steps" role="tablist" aria-label="步骤"></div>
    <div class="dispatch-demo__nav">
      <button type="button" class="dispatch-demo__btn" data-action="prev">上一步</button>
      <button type="button" class="dispatch-demo__btn dispatch-demo__btn--primary" data-action="next">下一步</button>
      <button type="button" class="dispatch-demo__btn" data-action="play" aria-pressed="false">自动播放</button>
    </div>
  </div>
  <p class="dispatch-demo__progress" data-progress aria-live="polite"></p>
  <svg class="dispatch-demo__stage" viewBox="0 0 960 400" width="100%" height="auto" role="img" aria-label="多项目调度示意动画"></svg>
  <div class="dispatch-demo__panel">
    <p class="dispatch-demo__one-liner" data-one></p>
    <h3 data-title></h3>
    <p data-body></p>
    <div class="dispatch-demo__cmd">
      <span class="dispatch-demo__say">你可以说</span>
      <code data-cmd></code>
      <button type="button" class="dispatch-demo__btn" data-action="copy">复制</button>
    </div>
    <ul data-facts></ul>
  </div>
</div>
<style>
.dispatch-demo{margin:1.25rem 0 1.75rem;padding:1rem;border:1px solid var(--line,#e5e7eb);border-radius:14px;background:var(--surface,#fff);outline:none}
.dispatch-demo:focus-visible{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent,#4f46e5) 55%,transparent)}
.dispatch-demo__toolbar{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center}
.dispatch-demo__steps{display:flex;flex-wrap:wrap;gap:.4rem}
.dispatch-demo__step{border:1px solid var(--line,#e5e7eb);background:var(--panel,#f3f4f6);color:var(--text,#111827);border-radius:999px;padding:.3rem .75rem;font-size:.85rem;cursor:pointer;min-width:2rem}
.dispatch-demo__step[aria-selected="true"]{background:var(--accent-soft,#e0e7ff);border-color:color-mix(in srgb,var(--accent,#4f46e5) 45%,var(--line,#e5e7eb));font-weight:600}
.dispatch-demo__nav{display:flex;flex-wrap:wrap;gap:.5rem}
.dispatch-demo__btn{border:1px solid var(--line,#e5e7eb);background:var(--panel,#f3f4f6);color:var(--text,#111827);border-radius:10px;padding:.4rem .8rem;cursor:pointer}
.dispatch-demo__btn--primary{background:var(--text,#111827);color:#fff;border-color:transparent}
.dispatch-demo__btn[aria-pressed="true"]{background:var(--accent-soft,#e0e7ff);border-color:color-mix(in srgb,var(--accent,#4f46e5) 40%,var(--line,#e5e7eb))}
.dispatch-demo__btn:disabled{opacity:.45;cursor:not-allowed}
.dispatch-demo__progress{margin:.75rem 0 .25rem;color:var(--muted,#6b7280);font-size:.9rem}
.dispatch-demo__stage{display:block;margin-top:.5rem;border-radius:12px;background:#0b1220;overflow:visible}
.dispatch-demo__panel{margin-top:.9rem;padding:1rem 1.1rem;border-radius:12px;background:var(--panel,#f3f4f6)}
.dispatch-demo__one-liner{margin:0 0 .55rem;padding:.45rem .7rem;border-radius:8px;background:color-mix(in srgb,var(--accent,#4f46e5) 12%,#fff);color:var(--text,#111827);font-weight:600;font-size:.95rem}
.dispatch-demo__panel h3{margin:0 0 .35rem;font-size:1.05rem}
.dispatch-demo__panel p{margin:0 0 .65rem;line-height:1.6;color:var(--text,#1f2937)}
.dispatch-demo__cmd{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.75rem}
.dispatch-demo__say{font-size:.85rem;color:var(--muted,#6b7280);flex:0 0 auto}
.dispatch-demo__cmd code{flex:1 1 14rem;display:block;padding:.55rem .7rem;border-radius:8px;background:#111827;color:#dbeafe;white-space:pre-wrap;word-break:break-word;font-size:.88rem}
.dispatch-demo__panel ul{margin:0;padding-left:1.15rem}
.dispatch-demo__panel li{margin:.28rem 0;color:var(--muted,#4b5563);line-height:1.45}
.dispatch-demo .lane{fill:#111827;stroke:#1f2937}
.dispatch-demo .node{fill:#1f2937;stroke:#6b7280;stroke-width:1.5;transition:fill .35s,stroke .35s,stroke-width .35s,filter .35s}
.dispatch-demo .node.active{fill:#172554;stroke:#60a5fa;stroke-width:2.4;filter:drop-shadow(0 0 8px rgba(96,165,250,.45))}
.dispatch-demo .node.done{fill:#052e1c;stroke:#34d399;stroke-width:2}
.dispatch-demo .node.blocked{fill:#3f1d1d;stroke:#f87171;stroke-width:2.2}
.dispatch-demo .node.pulse{animation:dd-pulse 1.4s ease-in-out infinite}
.dispatch-demo .edge{fill:none;stroke:#374151;stroke-width:2;opacity:.3;transition:stroke .35s,opacity .35s,stroke-width .35s}
.dispatch-demo .edge.active{stroke:#60a5fa;stroke-width:2.6;opacity:1;stroke-dasharray:8 6;animation:dd-dash 1s linear infinite}
.dispatch-demo .edge.done{stroke:#34d399;stroke-width:2.2;opacity:.95;stroke-dasharray:none;animation:none}
.dispatch-demo .label{fill:#e5e7eb;font-size:14px;font-family:ui-sans-serif,system-ui,sans-serif;pointer-events:none;font-weight:600}
.dispatch-demo .sub,.dispatch-demo .zone{fill:#9ca3af;font-size:12px;font-family:ui-sans-serif,system-ui,sans-serif;pointer-events:none}
.dispatch-demo .zone{font-weight:500}
.dispatch-demo .emoji{font-size:16px}
.dispatch-demo .hint{fill:#94a3b8;font-size:11px;font-family:ui-sans-serif,system-ui,sans-serif}
@keyframes dd-pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(96,165,250,.25))}50%{filter:drop-shadow(0 0 14px rgba(96,165,250,.7))}}
@keyframes dd-dash{to{stroke-dashoffset:-28}}
</style>
<script>
(() => {
  const root = document.getElementById("dispatch-demo-app");
  if (!root || root.dataset.ready === "1") return;
  root.dataset.ready = "1";

  // 通俗版；图上：控制层 ~/.jj-flow / 主仓库 / 其它仓库
  const steps = [
    {
      title: "先想清楚：一次要改好几个项目",
      one: "一句话：调度 = 你批准名单后，按顺序把活派到多个仓库。",
      body: "比如密码过期提示要同时改「承接、兑接、承载」三个前台。你站在业务仓库里说话即可；派谁、做到哪，记在**控制层**目录里。",
      cmd: "分发当前任务到 承接和承载",
      facts: [
        "只改一个项目？用单仓闭环就行，不必调度",
        "不必先打开单独的「控制仓」项目",
        "控制层默认目录：~/.jj-flow（Windows 多为 %USERPROFILE%\\.jj-flow；可用 naming.json / 环境变量改）"
      ],
      active: { board: true, main: true },
      done: {},
      edges: ["main-board"]
    },
    {
      title: "先填齐：谁是源头、要派给谁",
      one: "没问清楚角色前，系统只会提醒你补信息，不会真派工。",
      body: "要分清：需求从哪来、以哪个仓库为主做、还要同步到哪些仓库。缺一项就只提示「信息还不够」，不会偷偷开工。",
      cmd: "主项目是承接，还要同步到兑接、承载",
      facts: [
        "主仓库：先在这里做出来、验清楚",
        "其它仓库：后面跟着改，或做适配",
        "名单不对后面全乱，所以先对齐"
      ],
      active: { board: true, main: true, a: true, b: true },
      done: {},
      edges: ["main-board", "board-a", "board-b"]
    },
    {
      title: "先预览：只出计划，不动代码",
      one: "预览 = 看菜单，还没下单。",
      body: "系统列出：会拆成哪些小任务、谁依赖谁、大概在哪个分支上改。你可以反复预览。这一步不会创建会话、也不会改仓库。",
      cmd: "预览分发：把 README 装依赖改成 pnpm，目标 承接、兑接、承载",
      facts: [
        "分支说不清时，会先停下来问你",
        "默认就在项目功能分支上改，不默认搞复杂隔离",
        "预览可以改完名单再来一次"
      ],
      active: { board: true, list: true },
      done: { main: true },
      edges: ["main-board"]
    },
    {
      title: "你点头：批准这份名单",
      one: "没你明确同意，不会真派。随口「行」不够。",
      body: "核对预览表：项目对不对、任务全不全。你明确说批准后，这份名单才算数。之后若改了目标名单或重做次数，要重新预览再批。",
      cmd: "批准当前预览的任务名单",
      facts: [
        "批准的是「任务名单」，不是让机器人自说自话开工",
        "改了目标 / 重做一轮，旧批准作废",
        "中途断开可以靠控制层（~/.jj-flow）里的记录接着做"
      ],
      active: { board: true, list: true, yes: true },
      done: {},
      edges: ["yes-board"]
    },
    {
      title: "真派发：先写入控制层，再开工",
      one: "先在控制层记下「派给谁了」，再去业务仓库干活。",
      body: "批准之后才会真正派发：先记一笔「任务已派出」，再绑定当前对话/会话。在 Grok 上默认就是这一个会话里按任务往下做，不用你再开一堆窗口。",
      cmd: "按刚才批准的名单开始派发",
      facts: [
        "默认不会自动合并、推远端、发版",
        "写代码默认在功能分支 + 仓库本身，不默认隔离目录",
        "中断后凭控制层目录恢复，不靠聊天记录"
      ],
      active: { board: true, main: true, yes: true },
      done: { list: true },
      edges: ["board-main", "yes-board"]
    },
    {
      title: "先做主仓库：改 → 验 → 审",
      one: "主仓库先跑通，再带其它项目。",
      body: "主仓库里按熟悉的节奏做：改代码、跑检查、做审查。主仓库没做完，一般不急着全面铺开其它仓库（有依赖的任务会等）。",
      cmd: "继续主仓库那一项（改完记得提交）",
      facts: [
        "进度以控制层记录 + 提交为准，聊天说「做完了」不算",
        "审查只读；开发才改代码",
        "一个小任务有固定编号，重复派不会乱记两遍"
      ],
      active: { main: true, board: true },
      done: { list: true, yes: true },
      edges: ["board-main", "main-board"]
    },
    {
      title: "有凭证才推进，再派其它仓库",
      one: "要有提交、检查、审查这些「凭证」，不能空口收工。",
      body: "主仓库证据齐了，再把活派到其它仓库（可以并行，或在一个会话里排队做）。某个项目卡住了，不会假装「全部完成」。",
      cmd: "同步到兑接、承载（按依赖继续）",
      facts: [
        "每个仓库可以：直接迁、改一点再迁、或判定不用改",
        "缺证据就停在「还没齐」",
        "一个失败不等于全家失败"
      ],
      active: { board: true, a: true, b: true, main: true },
      done: { list: true, yes: true },
      edges: ["main-board", "board-a", "board-b"]
    },
    {
      title: "要返工：开新一轮，别偷偷改旧单",
      one: "审查不过就重开一单，不要在旧任务编号上蒙混。",
      body: "某仓库被打回时：收口问题、升一轮尝试、再预览并请你批准。问题要写清楚、能对照代码，方便下一轮修。",
      cmd: "兑接那项审查不过，按意见返工再来一轮",
      facts: [
        "新一轮有新编号，避免新旧搅在一起",
        "怎么改代码由你选，不会默认强推 revert",
        "返工也要再过你的批准"
      ],
      active: { a: true, board: true },
      done: { main: true, b: true, list: true },
      edges: ["a-board", "board-a"],
      blocked: { a: true }
    },
    {
      title: "全部过关：控制层记「完成」",
      one: "全部完成 = 证据齐了，不是「我觉得好了」。",
      body: "每个目标仓库都有提交、审查通过、凭证文件齐全，才会记成完成。推到远端、合进开发分支，还要另走收工流程（或你自己 push），调度不会偷偷帮你合并。",
      cmd: "各目标都验收通过后收工 / 合并",
      facts: [
        "口头「好了」「已合并」不能当完成",
        "以后要接着做，只认控制层目录里的记录",
        "成功终态：完成 或 确认不用改"
      ],
      active: {},
      done: { board: true, main: true, a: true, b: true, list: true, yes: true },
      edges: ["main-board", "board-a", "board-b", "a-board", "b-board", "board-main"]
    }
  ];

  const labels = {
    board: ["控制层", "~/.jj-flow（默认）"],
    list: ["任务菜单", "预览出来的名单"],
    yes: ["你点头批准", "同意这份名单"],
    main: ["主仓库", "先在这里做"],
    a: ["其它仓库 A", "例如兑接"],
    b: ["其它仓库 B", "例如承载"]
  };

  const nodes = {
    list: { x: 36, y: 28, w: 168, h: 58 },
    board: { x: 340, y: 28, w: 250, h: 58 },
    yes: { x: 750, y: 28, w: 168, h: 58 },
    main: { x: 50, y: 208, w: 220, h: 82 },
    a: { x: 360, y: 208, w: 220, h: 82 },
    b: { x: 670, y: 208, w: 230, h: 82 }
  };

  const edgePaths = {
    "main-board": "M160 208 C 210 150, 300 100, 420 86",
    "board-main": "M420 86 C 300 100, 210 150, 160 208",
    "board-a": "M475 86 C 475 130, 470 160, 470 208",
    "a-board": "M470 208 C 470 160, 475 130, 475 86",
    "board-b": "M540 86 C 620 130, 720 160, 785 208",
    "b-board": "M785 208 C 720 160, 620 130, 540 86",
    "yes-board": "M750 57 C 680 57, 620 57, 580 57"
  };

  const stage = root.querySelector(".dispatch-demo__stage");
  const stepsEl = root.querySelector(".dispatch-demo__steps");
  const progress = root.querySelector("[data-progress]");
  const oneEl = root.querySelector("[data-one]");
  const titleEl = root.querySelector("[data-title]");
  const bodyEl = root.querySelector("[data-body]");
  const cmdEl = root.querySelector("[data-cmd]");
  const factsEl = root.querySelector("[data-facts]");
  const prevBtn = root.querySelector('[data-action="prev"]');
  const nextBtn = root.querySelector('[data-action="next"]');
  const playBtn = root.querySelector('[data-action="play"]');
  const copyBtn = root.querySelector('[data-action="copy"]');

  let index = 0;
  let playTimer = null;

  steps.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dispatch-demo__step";
    btn.setAttribute("role", "tab");
    btn.textContent = String(i + 1);
    btn.title = s.title;
    btn.addEventListener("click", () => {
      stopPlay();
      index = i;
      render();
    });
    stepsEl.appendChild(btn);
  });

  function nodeClass(id, step) {
    if (step.blocked && step.blocked[id]) return "node blocked pulse";
    if (step.active && step.active[id]) return "node active pulse";
    if (step.done && step.done[id]) return "node done";
    return "node";
  }

  function edgeClass(id, step) {
    if (!step.edges || !step.edges.includes(id)) return "edge";
    if (step.done && step.done.board && step.done.main && step.done.a && step.done.b) return "edge done";
    return "edge active";
  }

  function renderStage(step) {
    let svg = "";
    svg += '<defs>';
    svg += '<marker id="dd-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#60a5fa"/></marker>';
    svg += '<marker id="dd-arrow-done" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/></marker>';
    svg += "</defs>";

    svg += '<rect class="lane" x="20" y="12" width="920" height="92" rx="14"/>';
    svg += '<rect class="lane" x="20" y="176" width="920" height="148" rx="14"/>';
    svg += '<text class="zone" x="32" y="158">上面：控制层（调度状态）· 默认路径 ~/.jj-flow</text>';
    svg += '<text class="zone" x="32" y="348">下面：业务仓库（真正改代码）</text>';
    svg += '<text class="hint" x="620" y="378">蓝=正在做 · 绿=做完 · 红=要返工 · jj doctor 可看 control_root</text>';

    Object.entries(edgePaths).forEach(([id, d]) => {
      const cls = edgeClass(id, step);
      const marker = cls.includes("done") ? "url(#dd-arrow-done)" : "url(#dd-arrow)";
      svg += `<path class="${cls}" d="${d}" marker-end="${marker}"/>`;
    });

    Object.entries(nodes).forEach(([id, n]) => {
      const [t1, t2] = labels[id];
      svg += `<rect class="${nodeClass(id, step)}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="12"/>`;
      svg += `<text class="label" x="${n.x + 14}" y="${n.y + 28}">${t1}</text>`;
      svg += `<text class="sub" x="${n.x + 14}" y="${n.y + 50}">${t2}</text>`;
    });

    stage.innerHTML = svg;
  }

  function render() {
    const step = steps[index];
    [...stepsEl.children].forEach((btn, i) => {
      btn.setAttribute("aria-selected", i === index ? "true" : "false");
    });
    progress.textContent = `第 ${index + 1} / ${steps.length} 步 · 点数字或左右键 · 可自动播放`;
    oneEl.textContent = step.one;
    titleEl.textContent = step.title;
    bodyEl.textContent = step.body;
    cmdEl.textContent = step.cmd;
    factsEl.innerHTML = step.facts.map((f) => `<li>${f}</li>`).join("");
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === steps.length - 1;
    renderStage(step);
  }

  function stopPlay() {
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = null;
    }
    playBtn.setAttribute("aria-pressed", "false");
    playBtn.textContent = "自动播放";
  }

  function startPlay() {
    stopPlay();
    playBtn.setAttribute("aria-pressed", "true");
    playBtn.textContent = "停止";
    playTimer = setInterval(() => {
      if (index >= steps.length - 1) {
        stopPlay();
        return;
      }
      index += 1;
      render();
    }, 3800);
  }

  prevBtn.addEventListener("click", () => {
    stopPlay();
    if (index > 0) {
      index -= 1;
      render();
    }
  });
  nextBtn.addEventListener("click", () => {
    stopPlay();
    if (index < steps.length - 1) {
      index += 1;
      render();
    }
  });
  playBtn.addEventListener("click", () => {
    if (playTimer) stopPlay();
    else {
      if (index >= steps.length - 1) index = 0;
      render();
      startPlay();
    }
  });
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(steps[index].cmd);
      copyBtn.textContent = "已复制";
      setTimeout(() => {
        copyBtn.textContent = "复制";
      }, 1200);
    } catch {
      copyBtn.textContent = "失败";
      setTimeout(() => {
        copyBtn.textContent = "复制";
      }, 1200);
    }
  });
  root.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && index > 0) {
      stopPlay();
      index -= 1;
      render();
    }
    if (e.key === "ArrowRight" && index < steps.length - 1) {
      stopPlay();
      index += 1;
      render();
    }
    if (e.key === " " && e.target === root) {
      e.preventDefault();
      playBtn.click();
    }
  });

  render();
})();
</script>
